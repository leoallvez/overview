# https://singhajit.com/android-ci-cd-using-github-actions/
name: CI
on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OVER_API_KEY: ${{ secrets.OVER_API_KEY }}

jobs:
  # 1. Build & Static Analysis
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, Lint & Ktlint
        run: ./gradlew assembleDebug ktlintCheck lint --continue --stacktrace

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static_analysis_reports
          path: "**/build/reports/lint-results-*"

  # 2. Unit Tests, Snapshot Verification and Coverage
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, verify snapshots and coverage
        run: ./gradlew test :presentation:verifyPaparazziDebug koverXmlReport koverHtmlReport koverVerify --continue --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all_unit_test_reports
          path: "**/build/reports/tests/**"

      - name: Upload Snapshot Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot_report
          path: |
            presentation/build/reports/paparazzi/
            presentation/build/paparazzi/failures/

      - name: Upload Kover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover_report
          path: build/reports/kover/

  # 3. Mutation Tests (:domain)
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Mutation Tests (:domain)
        run: ./gradlew :domain:pitest --stacktrace

      - name: Upload Pitest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation_tests
          path: domain/build/reports/pitest/
